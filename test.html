<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070F10">
<title>Layout Test</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100dvh;}
  body{background:#070F10;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;overflow:hidden;}

  .content{flex:1;overflow-y:auto;background:#0F2426;margin:10px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}

  .tabbar{flex:0 0 auto;display:flex;background:#0B1A1B;border-top:2px solid #D8B45A;padding-bottom:env(safe-area-inset-bottom,0);}
  .tab-btn{flex:1;background:none;border:none;padding:14px 0;color:#89ADAA;font-size:0.8rem;text-align:center;}
  .tab-btn.active{color:#B9E86A;font-weight:700;}

  .marker{background:red;color:white;text-align:center;padding:8px;font-weight:bold;font-size:0.9rem;}
</style>
</head>
<body>

<div class="marker">IF YOU SEE THIS RED BAR TOUCHING THE TAB BAR BELOW WITH NO GAP, THE TEST PASSES</div>

<div class="content">This is test content.<br>The tab bar below should sit flush at the very bottom of your screen.</div>

<nav class="tabbar">
  <button class="tab-btn active">Tab 1</button>
  <button class="tab-btn">Tab 2</button>
  <button class="tab-btn">Tab 3</button>
</nav>

</body>
</html>
